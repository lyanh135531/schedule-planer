variables:
    HARBOR_IMAGE: ${HARBOR_URL}/${HARBOR_PROJECT}/talkfirst-support

stages:
    - build
    - deploy

build:
    stage: build
    image: docker:24.0.5
    services:
        - docker:24.0.5-dind
    before_script:
        - docker login -u ${HARBOR_USER} -p ${HARBOR_PASSWORD} ${HARBOR_URL}
    script:
        - docker build -t ${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA} -t ${HARBOR_IMAGE}:latest .
        - docker push ${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}
        - docker push ${HARBOR_IMAGE}:latest
    only:
        - main

deploy:
    stage: deploy
    image: alpine:latest
    before_script:
        - apk add --no-cache openssh-client
        - eval $(ssh-agent -s)
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        - mkdir -p ~/.ssh
        - chmod 700 ~/.ssh
        - ssh-keyscan ${DEPLOY_HOST} >> ~/.ssh/known_hosts
    script:
        - ssh ${DEPLOY_USER}@${DEPLOY_HOST} "cd /talkfirst-support &&
          docker login -u ${HARBOR_USER} -p ${HARBOR_PASSWORD} ${HARBOR_URL} &&
          docker compose pull &&
          docker compose up -d"
    only:
        - main
